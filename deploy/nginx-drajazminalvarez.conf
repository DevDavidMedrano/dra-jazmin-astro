server {
    listen 80;
    listen [::]:80;
    server_name drajazminalvarez.com www.drajazminalvarez.com;

    root /var/www/drajazminalvarez;
    index index.html;

    # Astro genera /ruta/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Archivos con hash de Astro: se pueden cachear para siempre
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
